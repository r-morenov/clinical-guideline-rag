[project]
name = "clinical-guideline-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Richar Moreno", email = "312328915+r-morenov@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.3",
]

[project.scripts]
clinical-guideline-rag = "clinical_guideline_rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100           # maximum characters per line of code
target-version = "py312"    # write modern Python 3.12 style
src = ["src"]               # where our own package lives (so imports are grouped correctly)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # which families of checks to run
ignore = ["E501"]                     # long lines: the formatter handles code; long comments are fine
